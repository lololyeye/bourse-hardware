<!doctype html>
<html lang="fr" data-theme-effective="dark" data-motion-effective="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bourse du Hardware</title>
<meta name="description" content="Suivi des prix des composants PC : indice de marché, graphiques, signaux d'achat, alertes, configurations et budget.">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply appearance before first paint (no theme flash). Fails safe on blocked storage.
  (function () {
    var s = {};
    try { s = (JSON.parse(localStorage.getItem("bourse-hardware-v2")) || {}).settings || {}; } catch (e) {}
    var r = document.documentElement, mq = function (q) { return window.matchMedia && matchMedia(q).matches; };
    var theme = s.theme === "light" || s.theme === "dark" ? s.theme : (s.theme === "system" && mq("(prefers-color-scheme: light)") ? "light" : "dark");
    var m = s.motion || "auto";
    r.dataset.themeEffective = theme;
    r.dataset.motion = m;
    r.dataset.motionEffective = m === "auto" ? (mq("(prefers-reduced-motion: reduce)") ? "reduced" : "full") : m;
    if (s.accent) r.dataset.accent = s.accent;
    if (s.density) r.dataset.density = s.density;
    if (s.sidebarCollapsed) r.dataset.sidebar = "collapsed";
  })();
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<a class="sr-only" href="#view">Aller au contenu</a>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
    <a class="brand" href="#/overview">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5l5-5.5 4 3.2 7-8.2"/></svg></span>
      <span class="brand-name">Bourse du Hardware<small>Prix · signaux · budget</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="data-pill" id="dataPill"></div>
      <button class="btn btn-ghost btn-sm desktop-only" id="collapseBtn" aria-label="Réduire la barre latérale"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false"></button>
      <span class="status" id="marketStatus" role="status"></span>
      <div class="search" role="search">
        <span id="searchIcon"></span>
        <input id="search" type="search" placeholder="Rechercher un composant, une page…" autocomplete="off" aria-label="Rechercher" aria-controls="searchResults" aria-expanded="false">
        <kbd>/</kbd>
        <div class="search-results" id="searchResults" role="listbox" hidden></div>
      </div>
      <span class="spacer"></span>
      <span class="last-update" id="lastUpdate"></span>
      <button class="icon-btn" id="notifBtn" aria-label="Centre de notifications" aria-haspopup="dialog" aria-expanded="false"></button>
      <button class="icon-btn" id="prefsBtn" aria-label="Préférences d'affichage" aria-haspopup="dialog" aria-expanded="false"></button>
    </header>
    <div class="ticker" id="ticker" aria-label="Derniers prix"></div>
    <main class="view" id="view" tabindex="-1">
      <div class="grid cols-4"><div class="panel skeleton" style="height:120px"></div><div class="panel skeleton" style="height:120px"></div><div class="panel skeleton" style="height:120px"></div><div class="panel skeleton" style="height:120px"></div></div>
    </main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Navigation rapide"></nav>
<noscript><p style="padding:24px">Ce site a besoin de JavaScript pour fonctionner.</p></noscript>
</body>
</html>
